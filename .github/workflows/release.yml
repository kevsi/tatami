# Publication d'une version de Tatami (ADR 0020, étapes M4 et M6).
#
# ## Deux modes, un seul branché
#
# - `test` : prérelease GitHub signée avec la clé de **test**, aucun SignPath.
#   C'est le mode de M4/M5. Il produit de vrais installeurs et un vrai
#   `latest.json`, mais `releases/latest` ne le sert jamais : GitHub exclut les
#   préreleases de cette route, et le job le vérifie explicitement.
# - `production` : prévu en M6 (SignPath). Il est **refusé** ici tant que la
#   tâche n'est pas livrée. Publier aujourd'hui produirait un binaire non signé
#   présenté comme signé — un échec explicite vaut mieux.
#
# ## Le tag porte la version
#
# `v0.2.0-rc.1` exige `0.2.0-rc.1` dans `apps/desktop/package.json`,
# `tauri.conf.json` et `src-tauri/Cargo.toml`. Le workflow refuse un décalage :
# c'est la seule façon d'être sûr que le binaire publié porte le numéro annoncé.
# Il ne modifie aucune version lui-même — une release ne réécrit pas le dépôt.
#
# ## Pourquoi un brouillon avant la publication
#
# `gh release create` publie immédiatement. Si un envoi d'asset échoue au
# milieu, la release reste visible, incomplète, et un client peut tomber dessus.
# Le brouillon n'est visible de personne ; on publie à la fin, en une action.

name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (ex. v0.2.0-rc.1)'
        required: true
        type: string
      mode:
        description: 'test = prérelease avec la clé de test ; production = M6 (refusé)'
        required: true
        default: test
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

# Une release ne s'annule pas : deux exécutions sur le même tag se suivent.
# (Leçon du 2026-10-01 : une deuxième exécution pendant la première écrivait le
# même brouillon et remplaçait des assets en cours d'écriture.)
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mode demandé
        env:
          MODE: ${{ inputs.mode || 'test' }}
        run: |
          if [ "$MODE" != "test" ]; then
            echo "::error::Le mode '$MODE' n'est pas encore branché (M6 : SignPath). Publier produirait un binaire non signé présenté comme signé."
            exit 1
          fi
          echo "Mode test : prérelease, clé de signature de test, aucun SignPath."

  verifications:
    needs: mode
    uses: ./.github/workflows/verifications.yml
    with:
      # Sur un tag, `github.ref` vaut `refs/tags/v…`. Sur `workflow_dispatch`,
      # c'est le tag saisi : sans cela, les portes vérifieraient `master`
      # pendant que le binaire se construit sur le tag.
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  publier:
    needs: verifications
    runs-on: windows-latest
    # Les secrets de signature vivent dans l'environnement, pas au niveau du
    # dépôt : une prérelease de test ne peut pas signer avec la clé de
    # production, et M6 pourra exiger une approbation sur `release`.
    environment: release-test
    permissions:
      contents: write
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Dépôt (le tag, même en workflow_dispatch)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Tag et versions concordent
        id: version
        env:
          TAG_ENTREE: ${{ inputs.tag }}
          REF: ${{ github.ref_name }}
        run: |
          $tag = if ($env:TAG_ENTREE) { $env:TAG_ENTREE } else { $env:REF }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' n'a pas la forme v<version sémantique>."
          }
          $version = $Matches[1]

          $pkg = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path apps/desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value

          $verifs = [ordered]@{
            'apps/desktop/package.json'              = $pkg
            'apps/desktop/src-tauri/tauri.conf.json' = $tauri
            'apps/desktop/src-tauri/Cargo.toml'      = $cargo
          }
          foreach ($cle in $verifs.Keys) {
            if ($verifs[$cle] -ne $version) {
              throw "$cle porte '$($verifs[$cle])' alors que le tag annonce '$version'. Bumper les versions avant de taguer."
            }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Tag $tag = version $version (package.json, tauri.conf.json, Cargo.toml)."

      - name: Secrets de signature présents
        env:
          CLE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MOT_DE_PASSE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Le message doit dire **où** ajouter le secret : un job qui échoue
          # sur « secret manquant » sans chemin fait perdre une demi-heure.
          if (-not $env:CLE) {
            throw "TAURI_SIGNING_PRIVATE_KEY absent de l'environnement 'release-test'. Ajouter la clé de test et son mot de passe dans Settings > Environments > release-test > Environment secrets."
          }
          if (-not $env:MOT_DE_PASSE) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD absent de l'environnement 'release-test'."
          }
          # Jamais la clé, jamais son contenu : seule sa longueur est utile au diagnostic.
          Write-Host "Clé de signature présente ($($env:CLE.Length) caractères), mot de passe présent."

      # --- Outils (mêmes versions que `verifications.yml`) -------------------

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Construction du moteur
        run: powershell -ExecutionPolicy Bypass -File scripts/build-engine.ps1

      # --- Configuration de la release --------------------------------------
      #
      # `tauri.test.conf.json` porte la clé **publique de test**, l'endpoint
      # local et `createUpdaterArtifacts`. On le superpose avec un fichier
      # **généré** qui ne change que l'endpoint : le manifeste est celui de la
      # prérelease de ce tag, et aucun fichier du dépôt ne dépend du tag.
      #
      # `dangerousInsecureTransportProtocol` repasse à `false` : l'endpoint est
      # en HTTPS, et un binaire publié ne doit pas garder l'autorisation HTTP
      # ouverte pour le confort du test local.

      - name: Configuration de l'endpoint
        id: config
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DEPOT: ${{ github.repository }}
        run: |
          $overlay = [ordered]@{
            plugins = [ordered]@{
              updater = [ordered]@{
                endpoints = @("https://github.com/$env:DEPOT/releases/download/$env:TAG/latest.json")
                dangerousInsecureTransportProtocol = $false
              }
            }
          }
          $chemin = Join-Path $env:RUNNER_TEMP 'tatami-release.conf.json'
          $json = $overlay | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText($chemin, $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Endpoint : https://github.com/$env:DEPOT/releases/download/$env:TAG/latest.json"
          "overlay=$chemin" >> $env:GITHUB_OUTPUT

      # Pas de MSI ici : WiX refuse un identifiant de prérelease non numérique
      # (« optional pre-release identifier in app version must be numeric-only »,
      # mesuré le 2026-10-22, run 39785715116). `0.2.0-rc.1` est donc une
      # prérelease **NSIS seule** ; le MSI revient avec une version stable, et
      # c'est le NSIS que `tauri-plugin-updater` installe sous Windows.
      - name: Build signé (NSIS, artefacts d'updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm -C apps/desktop tauri build --config src-tauri/tauri.test.conf.json --config "${{ steps.config.outputs.overlay }}"
          if ($LASTEXITCODE -ne 0) { throw "tauri build a échoué" }

      - name: Préparer latest.json et SHA256SUMS.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/preparer-release.ps1 `
            -Version $env:VERSION -Tag $env:TAG -Depot $env:GITHUB_REPOSITORY `
            -Notes "Prérelease de test construite par GitHub Actions (commit $env:GITHUB_SHA)."
          if ($LASTEXITCODE -ne 0) { throw "préparation de la release échouée" }

      # --- La signature correspond-elle à l'installeur ? ---------------------
      #
      # Même crate et même séquence que `verify_signature` du plugin. Le
      # manifeste est aussi relu avec les champs que le plugin exige.

      - name: Signature et manifeste
        run: |
          $exes = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($exes.Count -ne 1) { throw "Attendu un installeur NSIS, trouvé $($exes.Count)." }
          $env:TATAMI_INSTALLEUR = $exes[0].FullName
          $env:TATAMI_INSTALLEUR_SIG = "$($exes[0].FullName).sig"
          $env:TATAMI_MANIFESTE = (Resolve-Path dist-release/latest.json).Path
          $env:TATAMI_CLE_PUBLIQUE = (Get-Content apps/desktop/src-tauri/tauri.test.conf.json -Raw |
            ConvertFrom-Json).plugins.updater.pubkey

          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml `
            --test signature_installeur -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "La signature publiée ne correspond pas à l'installeur (ou latest.json est invalide). Rien n'est publié."
          }

      # --- Publication ------------------------------------------------------

      - name: Publier la prérelease (brouillon, assets, puis publication)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 4 au minimum : NSIS + sa `.sig`, `latest.json`, `SHA256SUMS.txt`.
          # Le MSI et sa `.sig` s'y ajoutent pour une version stable, et c'est
          # `scripts/preparer-release.ps1` qui exige alors les deux installeurs.
          $assets = @(Get-ChildItem dist-release -File | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 4) { throw "Attendu au moins 4 fichiers dans dist-release, trouvé $($assets.Count)." }
          $assets | ForEach-Object { Write-Host "  asset : $_" }

          gh release view $env:TAG --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --verify-tag --draft --prerelease `
              --title "Tatami $env:VERSION (test)" `
              --notes "Prérelease de test construite par GitHub Actions (commit $env:GITHUB_SHA)."
            if ($LASTEXITCODE -ne 0) { throw "création du brouillon échouée" }
          } else {
            Write-Host "Release $env:TAG déjà présente : les assets seront remplacés (--clobber)."
          }

          gh release upload $env:TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "envoi des assets échoué" }

          # Publier **en dernier** : jusque-là, personne ne voit la release.
          gh release edit $env:TAG --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "publication de la prérelease échouée" }
          Write-Host "Prérelease publiée : https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"

      - name: 'releases/latest ne sert pas cette prérelease'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Le critère « jamais latest » n'est pas une intention : GitHub exclut
          # les préreleases de cette route, et on le lit.
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Aucune release stable : /releases/latest répond 404. La prérelease n'est donc pas servie."
            exit 0
          }
          $latest = ($json | ConvertFrom-Json).tag_name
          if ($latest -eq $env:TAG) {
            throw "/releases/latest sert $env:TAG, qui est une prérelease : le marquage a échoué."
          }
          Write-Host "/releases/latest = $latest (≠ $env:TAG)."

      - name: Les assets publiés se valident après publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # On ne vérifie pas seulement les fichiers locaux : ce sont les octets
          # **téléchargés depuis la release** que l'application recevra. Un envoi
          # tronqué ou un `.sig` mélangé ne se voit nulle part ailleurs.
          $dir = Join-Path $env:RUNNER_TEMP 'publie'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download $env:TAG --dir $dir --clobber --pattern '*-setup.exe*' --pattern 'latest.json'
          if ($LASTEXITCODE -ne 0) { throw "téléchargement des assets publiés échoué" }

          $exe = @(Get-ChildItem (Join-Path $dir '*-setup.exe'))
          if ($exe.Count -ne 1) { throw "Attendu un installeur publié, trouvé $($exe.Count)." }

          $manifeste = Join-Path $dir 'latest.json'
          $local = (Get-FileHash 'dist-release/latest.json' -Algorithm SHA256).Hash
          $distant = (Get-FileHash $manifeste -Algorithm SHA256).Hash
          if ($local -ne $distant) {
            throw "latest.json publié ≠ latest.json construit (sha256 $local ≠ $distant)."
          }

          $env:TATAMI_INSTALLEUR = $exe[0].FullName
          $env:TATAMI_INSTALLEUR_SIG = "$($exe[0].FullName).sig"
          $env:TATAMI_MANIFESTE = $manifeste
          $env:TATAMI_CLE_PUBLIQUE = (Get-Content apps/desktop/src-tauri/tauri.test.conf.json -Raw |
            ConvertFrom-Json).plugins.updater.pubkey
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml `
            --test signature_installeur -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "La signature publiée ne valide pas l'installeur publié."
          }
          Write-Host "Assets publiés : signature valide, manifeste identique octet pour octet."

      - name: Récapitulatif
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $lignes = @(
            "### Tatami $env:VERSION (test)",
            "",
            "- tag : ``$env:TAG``",
            "- release : https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG",
            "- assets : NSIS, sa ``.sig``, ``latest.json``, ``SHA256SUMS.txt`` (un MSI et sa ``.sig`` s'y ajoutent pour une version stable)",
            "- signature : vérifiée par ``signature_installeur`` (minisign-verify, même crate que le plugin)",
            "- ``releases/latest`` : non servie (prérelease, vérifié)",
            "",
            "Le fichier ``latest.json`` de cette prérelease n'est installable que par une"
            "application dont l'endpoint pointe ce tag (build de test) : c'est ce que M5"
            "exerce sur un compte Windows dédié."
          )
          $lignes | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

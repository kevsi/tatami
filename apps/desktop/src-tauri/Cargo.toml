[package]
name = "tatami-desktop"
version = "0.1.0"
edition = "2021"

# Bibliothèque + binaire (tâche 5.3).
# Le code est dans la bibliothèque pour que `tests/contrat_moteur.rs` puisse
# rejouer les réponses enregistrées du moteur contre le code de production.
# Sans cela, un test d'intégration ne voit que le schéma et ne prouve rien de la
# façon dont Rust lit réellement une réponse. Cf. `src/lib.rs`.
[lib]
name = "tatami_desktop"
path = "src/lib.rs"

[[bin]]
name = "tatami-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` : la fonction de zone de notification n'existe pas sans ce feature
# (doc officielle : « Available on desktop and crate feature tray-icon only »).
# Ajouté le 2026-10-05 pour la tâche 3.4.
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Choix humain du 2026-10-05 : selecteur natif de dossier pour les
# téléchargements. Plugin officiel Tauri v2 ; permission declaree dans
# `capabilities/default.json` (ADR 0004).
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
sha2 = "0.10"
ed25519-dalek = "3"
flate2 = "1.1.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

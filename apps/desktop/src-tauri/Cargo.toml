[package]
name = "tatami-desktop"
version = "0.2.0-rc.5"
edition = "2021"
# `default-run` est **indispensable** dès qu'il y a deux binaires : sans lui,
# `cargo run` (donc `tauri dev`, et la CI) refuse de démarrer en demandant
# `--bin`. Mesuré le 2026-10-05 à l'ajout de `tatami-moteur` : l'application
# entière ne démarrait plus.
#
# Et cette clé est de `[package]` : la mettre après `[lib]` la fait tomber dans
# la table de la bibliothèque, où Cargo l'ignore silencieusement — et l'erreur
# de départ est alors « cargo run ne sait pas quel binaire », sans rapport avec
# la cause.
default-run = "tatami-desktop"

# Bibliothèque + binaire (tâche 5.3).
# Le code est dans la bibliothèque pour que `tests/contrat_moteur.rs` puisse
# rejouer les réponses enregistrées du moteur contre le code de production.
# Sans cela, un test d'intégration ne voit que le schéma et ne prouve rien de la
# façon dont Rust lit réellement une réponse. Cf. `src/lib.rs`.
[lib]
name = "tatami_desktop"
path = "src/lib.rs"

[[bin]]
name = "tatami-desktop"
path = "src/main.rs"

# Tâche 5.1 : gestion du moteur en ligne de commande (mode manuel). Ce binaire
# n'implémente rien : il appelle `tatami_desktop::moteur`, le même code et la
# même clé embarquée que l'application. Voir `src/bin/tatami-moteur.rs`.
[[bin]]
name = "tatami-moteur"
path = "src/bin/tatami-moteur.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image` sert le téléchargement et la lecture d'archive : Rust doit border une
# image avant de l'écrire, et déduire le type **des octets** et non d'un en-tête.
image = "0.25"
# `tray-icon` : la fonction de zone de notification n'existe pas sans ce feature
# (doc officielle : « Available on desktop and crate feature tray-icon only »).
# Ajouté le 2026-10-05 pour la tâche 3.4.
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Choix humain du 2026-10-05 : selecteur natif de dossier pour les
# téléchargements. Plugin officiel Tauri v2 ; permission declaree dans
# `capabilities/default.json` (ADR 0004).
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Mise à jour automatique (ADR 0020) : plugin officiel Tauri v2, côté Rust
# seulement. L'interface ne parle pas à l'API JS du plugin ; elle appelle nos
# commandes (etat_maj, verifier_maj, installer_maj).
#
# `default-features = false` : la feature `zip` du plugin (activée par défaut)
# tire `zip 4.6.1`, qui porte trois avis RUSTSEC-2026-0367/0368/0369 dont le
# correctif n'existe qu'à partir de `zip 9`. Or ce chemin n'est **jamais**
# atteint ici : `install_inner` ne décompresse que si la charge utile est une
# archive ZIP, et nous publions l'installeur NSIS `.exe` (voir
# `scripts/preparer-release.ps1`). Mesuré le 2026-10-20 : sans la feature,
# `cargo tree -i zip` ne trouve plus le crate et `cargo audit` ne rend plus
# aucune vulnérabilité. À réactiver si un jour on publie un `.zip`.
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "rustls-tls",
    "system-proxy",
] }
sha2 = "0.10"
ed25519-dalek = "3"
flate2 = "1.1.10"
thiserror = "1"
# Transitives de Tauri rendues explicites pour la canonicalisation de chemins
# (`custom_source.rs`) : dunce canonicalise sans préfixe `\\?\` sur Windows.
dunce = "1"
dirs-next = "2"

[dev-dependencies]
proptest = "1.11.0"
# Même crate que `tauri-plugin-updater` (2.11.0) vérifie au moment d'installer,
# et même version résolue (0.3.0 dans Cargo.lock). Elle sert au test
# `signature_installeur`, qui prouve qu'un `.sig` publié correspond à
# l'installeur publié — le plugin ne peut le faire qu'après téléchargement.
minisign-verify = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

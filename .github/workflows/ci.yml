# Tatami — déclencheurs de la CI.
#
# Les vérifications elles-mêmes vivent dans `verifications.yml`, qui est un
# workflow **réutilisable** (`workflow_call`) partagé avec `release.yml`. Ce
# fichier ne contient que ce qui doit rester propre à la CI : quand elle part.
#
# Ne rien ajouter ici sans le justifier : une vérification écrite dans ce
# fichier ne tournerait pas avant une release, et deux listes de commandes
# divergent toujours.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Les vérifications ont besoin de lire le dépôt (checkout, gitleaks) et, sur
# une PR, de lire la PR (gitleaks y compare la branche à sa base). Rien n'écrit.
permissions:
  contents: read
  pull-requests: read

jobs:
  verifications:
    uses: ./.github/workflows/verifications.yml
    # Transmet les secrets du dépôt au workflow appelé. Il n'en a pas besoin
    # aujourd'hui (`github.token` suffit), mais l'oubli produirait un jeton vide
    # dans gitleaks, et l'échec parlerait de l'action, pas du workflow appelant.
    secrets: inherit
